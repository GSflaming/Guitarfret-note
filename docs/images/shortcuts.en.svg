<svg xmlns="http://www.w3.org/2000/svg" width="900" height="668" viewBox="0 0 900 668" role="img" aria-labelledby="title desc"><title id="title">Shortcuts for your system</title><desc id="desc">A shortcut reference generated from the application. Windows uses Ctrl plus scroll wheel; macOS uses Command plus scroll wheel.</desc><style>text{font:15px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#242424}.key{font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.muted{fill:#6f6f6f;font-size:13px}</style><rect width="900" height="668" rx="16" fill="#fafafa"/><text x="40" y="47" style="font-size:25px;font-weight:600">Shortcuts for your system</text><text x="40" y="77" class="muted">Tools → Shortcuts · Detected automatically; manual override available</text><text x="40" y="109" class="muted">Action</text><text x="500" y="109" style="font-weight:600">Windows</text><text x="700" y="109" style="font-weight:600">macOS</text><path d="M32 163H868" stroke="#e8e8e8"/><text x="40" y="146">Expand / collapse tools</text><text x="500" y="146" class="key">C</text><text x="700" y="146" class="key">C</text><path d="M32 202H868" stroke="#e8e8e8"/><text x="40" y="185">Play selected notes together</text><text x="500" y="185" class="key">Space</text><text x="700" y="185" class="key">Space</text><path d="M32 241H868" stroke="#e8e8e8"/><text x="40" y="224">Play arpeggio</text><text x="500" y="224" class="key">A</text><text x="700" y="224" class="key">A</text><path d="M32 280H868" stroke="#e8e8e8"/><text x="40" y="263">Enter / leave recording mode</text><text x="500" y="263" class="key">P</text><text x="700" y="263" class="key">P</text><path d="M32 319H868" stroke="#e8e8e8"/><text x="40" y="302">Reset position and size</text><text x="500" y="302" class="key">0</text><text x="700" y="302" class="key">0</text><path d="M32 358H868" stroke="#e8e8e8"/><text x="40" y="341">Open shortcut guide</text><text x="500" y="341" class="key">?</text><text x="700" y="341" class="key">?</text><path d="M32 397H868" stroke="#e8e8e8"/><text x="40" y="380">Close / stop / leave / clear</text><text x="500" y="380" class="key">Esc</text><text x="700" y="380" class="key">⎋ Esc</text><path d="M32 436H868" stroke="#e8e8e8"/><text x="40" y="419">Move string / fret (board focused)</text><text x="500" y="419" class="key">↑ ↓ ← →</text><text x="700" y="419" class="key">↑ ↓ ← →</text><path d="M32 475H868" stroke="#e8e8e8"/><text x="40" y="458">Select / deselect (board focused)</text><text x="500" y="458" class="key">Enter</text><text x="700" y="458" class="key">↩ Return</text><path d="M32 514H868" stroke="#e8e8e8"/><text x="40" y="497">Move between controls</text><text x="500" y="497" class="key">Tab / Shift + Tab</text><text x="700" y="497" class="key">Tab / Shift + Tab</text><path d="M32 553H868" stroke="#e8e8e8"/><text x="40" y="536">First / last circular tool</text><text x="500" y="536" class="key">Home / End</text><text x="700" y="536" class="key">Home / End</text><path d="M32 592H868" stroke="#e8e8e8"/><text x="40" y="575">Zoom with the mouse</text><text x="500" y="575" class="key">Ctrl + scroll wheel</text><text x="700" y="575" class="key">⌘ + scroll wheel</text><text x="40" y="635" class="muted">Press letter keys directly. Shortcuts pause while typing; Esc follows the current context.</text></svg>
