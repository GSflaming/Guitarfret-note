<svg xmlns="http://www.w3.org/2000/svg" width="900" height="668" viewBox="0 0 900 668" role="img" aria-labelledby="title desc"><title id="title">快捷键随系统显示</title><desc id="desc">由应用当前快捷键配置生成的功能说明图。Windows 使用 Ctrl 加滚轮，macOS 使用 Command 加滚轮；字母快捷键直接按。</desc><style>text{font:15px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#242424}.key{font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.muted{fill:#6f6f6f;font-size:13px}</style><rect width="900" height="668" rx="16" fill="#fafafa"/><text x="40" y="47" style="font-size:25px;font-weight:600">快捷键随系统显示</text><text x="40" y="77" class="muted">工具 → 快捷键 · 自动识别，也可手动切换</text><text x="40" y="109" class="muted">功能</text><text x="500" y="109" style="font-weight:600">Windows</text><text x="700" y="109" style="font-weight:600">macOS</text><path d="M32 163H868" stroke="#e8e8e8"/><text x="40" y="146">展开／收起工具</text><text x="500" y="146" class="key">C</text><text x="700" y="146" class="key">C</text><path d="M32 202H868" stroke="#e8e8e8"/><text x="40" y="185">同时弹响</text><text x="500" y="185" class="key">Space 空格</text><text x="700" y="185" class="key">Space 空格</text><path d="M32 241H868" stroke="#e8e8e8"/><text x="40" y="224">播放琶音</text><text x="500" y="224" class="key">A</text><text x="700" y="224" class="key">A</text><path d="M32 280H868" stroke="#e8e8e8"/><text x="40" y="263">进入／退出录屏模式</text><text x="500" y="263" class="key">P</text><text x="700" y="263" class="key">P</text><path d="M32 319H868" stroke="#e8e8e8"/><text x="40" y="302">复位指板位置和大小</text><text x="500" y="302" class="key">0</text><text x="700" y="302" class="key">0</text><path d="M32 358H868" stroke="#e8e8e8"/><text x="40" y="341">打开快捷键表</text><text x="500" y="341" class="key">?</text><text x="700" y="341" class="key">?</text><path d="M32 397H868" stroke="#e8e8e8"/><text x="40" y="380">收起／停止／退出／清空</text><text x="500" y="380" class="key">Esc</text><text x="700" y="380" class="key">⎋ Esc</text><path d="M32 436H868" stroke="#e8e8e8"/><text x="40" y="419">选弦和选品（指板聚焦时）</text><text x="500" y="419" class="key">↑ ↓ ← →</text><text x="700" y="419" class="key">↑ ↓ ← →</text><path d="M32 475H868" stroke="#e8e8e8"/><text x="40" y="458">选中／取消音符（指板聚焦时）</text><text x="500" y="458" class="key">Enter</text><text x="700" y="458" class="key">↩ Return</text><path d="M32 514H868" stroke="#e8e8e8"/><text x="40" y="497">移动控件焦点</text><text x="500" y="497" class="key">Tab / Shift + Tab</text><text x="700" y="497" class="key">Tab / Shift + Tab</text><path d="M32 553H868" stroke="#e8e8e8"/><text x="40" y="536">工具菜单首项／末项</text><text x="500" y="536" class="key">Home / End</text><text x="700" y="536" class="key">Home / End</text><path d="M32 592H868" stroke="#e8e8e8"/><text x="40" y="575">鼠标缩放指板</text><text x="500" y="575" class="key">Ctrl + 滚轮</text><text x="700" y="575" class="key">⌘ + 滚轮</text><text x="40" y="635" class="muted">字母键直接按；输入文字时不触发。Esc 根据当前状态处理。</text></svg>
